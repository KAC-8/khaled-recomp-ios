<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f8" />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("kc-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#111214" : "#f7f7f8";
      })();
    </script>
    <meta
      name="description"
      content="Khalid Cut — تدريب كالستنكس مدروس، تغذية متوازنة، وتتبع يحترم جسمك."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Khalid Cut" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/assets/arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Khalid Cut — قوتك، بإيقاعك</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

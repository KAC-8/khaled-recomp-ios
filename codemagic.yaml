workflows:
  khalid-recomp-unsigned-ipa:
    name: Khalid Recomp - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      node: v22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          npm install

      - name: Create Capacitor iOS project
        script: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iPhone app
        script: |
          set -euo pipefail
          cd ios/App

          if [ -d "App.xcworkspace" ]; then
            XCODE_CONTAINER=(-workspace App.xcworkspace)
          else
            XCODE_CONTAINER=(-project App.xcodeproj)
          fi

          xcodebuild             "${XCODE_CONTAINER[@]}"             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"

          rm -rf Payload KhalidRecomp-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" "Payload/KhalidRecomp.app"
          /usr/bin/zip -qry KhalidRecomp-unsigned.ipa Payload
          test -s KhalidRecomp-unsigned.ipa

      - name: Verify IPA
        script: |
          set -euo pipefail
          cd ios/App
          unzip -l KhalidRecomp-unsigned.ipa | head -60

    artifacts:
      - ios/App/KhalidRecomp-unsigned.ipa
      - ios/App/build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

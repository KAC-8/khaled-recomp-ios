<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Khalid Recomp"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>Khalid Recomp</title><style>html,body{margin:0;background:#07100c;color:#f5faf7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center}.l{text-align:center}.s{width:42px;height:42px;border:3px solid #284132;border-top-color:#b8ff5a;border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><main><div class="l"><div class="s"></div><b>Khalid Recomp</b></div></main><script>(async()=>{try{const names=['payload-1.txt','payload-2.txt','payload-3.txt','payload-4.txt','payload-5.txt'];const parts=await Promise.all(names.map(n=>fetch('./'+n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b=atob(parts.join('').replace(/\s+/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const ds=new DecompressionStream('gzip'),html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><div class="l"><b>تعذر فتح التطبيق</b><p>أعد تشغيل التطبيق وحاول مرة أخرى.</p></div></main>'}})();</script></body></html>

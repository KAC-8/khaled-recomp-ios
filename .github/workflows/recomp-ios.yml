name: Build Khalid Recomp unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor iOS project
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iPhone app
        working-directory: ios/App
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "App.xcworkspace" ]; then
            XCODE_CONTAINER=(-workspace App.xcworkspace)
          else
            XCODE_CONTAINER=(-project App.xcodeproj)
          fi

          xcodebuild             "${XCODE_CONTAINER[@]}"             -scheme App             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" "Payload/KhalidRecomp.app"
          /usr/bin/zip -qry KhalidRecomp-unsigned.ipa Payload

      - name: Verify IPA structure
        working-directory: ios/App
        run: |
          set -e
          test -s KhalidRecomp-unsigned.ipa
          unzip -l KhalidRecomp-unsigned.ipa | head -50

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KhalidRecomp-unsigned-ipa
          path: ios/App/KhalidRecomp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

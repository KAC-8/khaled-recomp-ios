name: Build Khalid Recomp unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: Build unsigned IPA
        working-directory: ios/App
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "App.xcworkspace" ]; then XCODE_CONTAINER=(-workspace App.xcworkspace); else XCODE_CONTAINER=(-project App.xcodeproj); fi
          xcodebuild "${XCODE_CONTAINER[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/KhalidRecomp.app
          /usr/bin/zip -qry KhalidRecomp-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KhalidRecomp-unsigned-ipa
          path: ios/App/KhalidRecomp-unsigned.ipa
